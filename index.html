<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div>
                <h1>TaskFlow</h1>
                <p>Organize your day. Achieve your goals.</p>
            </div>
            <span class="logo">✓</span>
        </header>

        <section class="stats">
            <div class="stat-card">
                <span>Total Tasks</span>
                <h2 id="totalTasks">0</h2>
            </div>
            <div class="stat-card">
                <span>Completed</span>
                <h2 id="completedTasks">0</h2>
            </div>
            <div class="stat-card">
                <span>Pending</span>
                <h2 id="pendingTasks">0</h2>
            </div>
        </section>

        <section class="progress-section">
            <div class="progress-heading">
                <span>Overall Progress</span>
                <strong id="progressText">0%</strong>
            </div>
            <div class="progress-track">
                <div id="progressBar"></div>
            </div>
        </section>

        <section class="task-form-section">
            <h2 id="formHeading">Add New Task</h2>

            <form id="taskForm">
                <input type="hidden" id="editId">

                <input
                    type="text"
                    id="taskTitle"
                    placeholder="Enter task title"
                    maxlength="100"
                    required
                >

                <textarea
                    id="taskDescription"
                    placeholder="Task description (optional)"
                    rows="3"
                ></textarea>

                <div class="form-row">
                    <select id="taskCategory">
                        <option value="Personal">Personal</option>
                        <option value="Study">Study</option>
                        <option value="Work">Work</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>

                    <select id="taskPriority">
                        <option value="Low">Low Priority</option>
                        <option value="Medium" selected>Medium Priority</option>
                        <option value="High">High Priority</option>
                    </select>
                </div>

                <label for="taskDate">Due Date</label>
                <input type="date" id="taskDate">

                <div class="form-actions">
                    <button type="submit" id="submitBtn">
                        Add Task
                    </button>
                    <button
                        type="button"
                        id="cancelEdit"
                        class="secondary-btn"
                        hidden
                    >
                        Cancel
                    </button>
                </div>
            </form>
        </section>

        <section class="tasks-section">
            <div class="tasks-heading">
                <h2>My Tasks</h2>
                <button id="clearCompleted" class="clear-btn">
                    Clear Completed
                </button>
            </div>

            <input
                type="search"
                id="searchInput"
                placeholder="Search tasks..."
            >

            <div class="filters">
                <button class="filter-btn active" data-filter="all">
                    All
                </button>
                <button class="filter-btn" data-filter="pending">
                    Pending
                </button>
                <button class="filter-btn" data-filter="completed">
                    Completed
                </button>
            </div>

            <div id="taskList" class="task-list"></div>
            <p id="emptyMessage" class="empty-message">
                No tasks found. Add your first task!
            </p>
        </section>

        <footer>
            <p>TaskFlow © 2026 | Built with HTML, CSS & JavaScript</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
